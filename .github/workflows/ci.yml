name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: "kind smoke scenario (all, dedicated, shared, connect, lifecycle, observe)"
        default: all
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make fmt-check vet test
      - run: make check-alerts

  kafka-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Unit tests and jar (compiled against Kafka 4.3.1)
        run: make kafka-plugins
      - name: Integration test in a real broker (the Strimzi 4.3.1 image the clusters use)
        run: make plugin-it

  e2e-envtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make e2e

  kind-real-strimzi:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Raise inotify limits (multi-node kind)
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
      - name: Install kind
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfLo "$HOME/.local/bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          chmod +x "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make kind-up
      - run: deploy/kind/smoke.sh "${{ inputs.scenario || 'all' }}"
      - name: Diagnostics
        if: failure()
        run: |
          free -m || true
          kubectl get nodes -o wide --show-labels || true
          kubectl get nodes -o json | jq -c '.items[] | {name: .metadata.name, taints: .spec.taints}' || true
          kubectl get pods -A -o wide || true
          kubectl get validatingadmissionpolicy,validatingadmissionpolicybinding,validatingwebhookconfiguration || true
          kubectl get validatingadmissionpolicy -o json | jq '.items[] | {name: .metadata.name, typeChecking: .status.typeChecking}' || true
          kubectl -n streamcell-system get deploy,job,pods -o wide || true
          kubectl -n streamcell-system logs deploy/streamcell-admission --tail=100 || true
          kubectl -n streamcell-system logs deploy/placement-auditor --tail=100 || true
          kubectl -n streamcell-system logs job/streamcell-admission-certgen --tail=50 || true
          kubectl get kafka,kafkanodepool -A -o yaml || true
          kubectl get tlsroute,gateway -A -o yaml | head -200 || true
          kubectl get kafkauser -A -o yaml | head -200 || true
          kubectl -n streamcell-monitoring logs deploy/prometheus --tail=60 || true
          for f in .cache/kind/canary.log; do echo "== $f"; tail -60 "$f"; done
          for ns in $(kubectl get ns -l streamcell.dev/inventory -o name | cut -d/ -f2); do
            echo "=== $ns: pods"; kubectl -n "$ns" get pods -o wide || true
            echo "=== $ns: cruise-control logs"; kubectl -n "$ns" logs deploy/$ns-cruise-control --tail=150 || true
            echo "=== $ns: cruise-control previous logs"; kubectl -n "$ns" logs deploy/$ns-cruise-control --previous --tail=150 || true
            echo "=== $ns: cruise-control describe"; kubectl -n "$ns" describe pod -l strimzi.io/name=$ns-cruise-control | tail -40 || true
            echo "=== $ns: broker-0 ERROR/WARN/authorizer lines"; kubectl -n "$ns" logs $ns-brokers-0 --tail=2000 | grep -iE "ERROR|WARN|authoriz|denied|policy" | tail -60 || true
            echo "=== $ns: controller ERROR lines"; kubectl -n "$ns" logs $ns-controllers-3 --tail=2000 | grep -iE "ERROR|authoriz|denied|policy" | tail -30 || true
          done
          kubectl get networkpolicy -A || true
          kubectl -n envoy-gateway-system get svc,pods -o wide || true
          kubectl -n envoy-gateway-system logs deploy/envoy-gateway --tail=100 || true
          kubectl -n streamcell-gateway get gateway -o yaml | head -80 || true
          kubectl get pods -A -l app.kubernetes.io/name=envoy -o name | head -3 | xargs -r -I{} sh -c 'echo "== {}"; kubectl -n envoy-gateway-system logs {} -c envoy --tail=50' || true
          cat .cache/kind/gw-forward.log || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl -n streamcell-operators logs deploy/strimzi-cluster-operator --tail=300 || true
          for f in .cache/kind/*.log; do echo "== $f"; tail -100 "$f"; done
      - if: always()
        run: make kind-down
