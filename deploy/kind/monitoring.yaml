# The cell's Prometheus (design §17), kind edition: one pod, no persistence, scraping the Kafka pods' metrics
# port and evaluating deploy/alerts/*.rules.yaml (loaded into the ConfigMap "streamcell-rules" by up.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: streamcell-monitoring
  labels:
    kubernetes.io/metadata.name: streamcell-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: streamcell-monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: streamcell-prometheus }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: streamcell-prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: streamcell-prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: streamcell-monitoring }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: streamcell-monitoring }
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    rule_files: [/etc/rules/*.yaml]
    scrape_configs:
      - job_name: streamcell-kafka
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
            regex: Kafka
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: tcp-prometheus
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: streamcell-monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      nodeSelector: { streamcell.dev/pool: control }
      tolerations: [{ key: streamcell.dev/control, operator: Exists, effect: NoSchedule }]
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/tmp/data, --storage.tsdb.retention.time=2h, --web.listen-address=:9090]
          ports: [{ containerPort: 9090 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: rules, mountPath: /etc/rules }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: rules, configMap: { name: streamcell-rules } }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: streamcell-monitoring }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
