# Protects the labels and taints that define node pools, and the namespace label that
# scopes the pod policy. Only the provisioners listed in the parameter ConfigMap (the cell
# agent / Karpenter identity) may change them; anyone else, including cluster admins
# acting by hand, is refused. Nodes registering themselves (CREATE) are not covered:
# Karpenter-launched nodes join with their pool labels, see docs/design.md §15.
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamcell-admission-params
  namespace: streamcell-system
data:
  # Comma-separated usernames allowed to change pool labels/taints. Overridden per environment.
  provisioners: "system:serviceaccount:streamcell-system:streamcell-agent"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: streamcell-node-protection
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["nodes"]
  variables:
    - name: newLabels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldLabels
      expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: newTaints
      expression: "has(object.spec.taints) ? object.spec.taints.filter(t, t.key.startsWith('streamcell.dev/')) : []"
    - name: oldTaints
      expression: "has(oldObject.spec.taints) ? oldObject.spec.taints.filter(t, t.key.startsWith('streamcell.dev/')) : []"
    - name: allowed
      expression: "params.data.provisioners.split(',').exists(u, u.trim() == request.userInfo.username)"
  validations:
    - expression: |-
        variables.allowed ||
        ['streamcell.dev/pool', 'streamcell.dev/dedicated-owner', 'streamcell.dev/nodepool'].all(k,
          (k in variables.newLabels ? variables.newLabels[k] : '') == (k in variables.oldLabels ? variables.oldLabels[k] : ''))
      reason: Forbidden
      messageExpression: |-
        'streamcell node protection [labels]: user ' + request.userInfo.username +
        ' may not change streamcell.dev/pool, dedicated-owner or nodepool labels on node ' + object.metadata.name
    - expression: "variables.allowed || variables.newTaints == variables.oldTaints"
      reason: Forbidden
      messageExpression: |-
        'streamcell node protection [taints]: user ' + request.userInfo.username +
        ' may not change streamcell.dev/ taints on node ' + object.metadata.name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: streamcell-node-protection
spec:
  policyName: streamcell-node-protection
  validationActions: [Deny, Audit]
  paramRef:
    name: streamcell-admission-params
    namespace: streamcell-system
    parameterNotFoundAction: Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: streamcell-namespace-protection
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["namespaces"]
  validations:
    - expression: |-
        params.data.provisioners.split(',').exists(u, u.trim() == request.userInfo.username) ||
        (('streamcell.dev/inventory' in object.metadata.labels) == ('streamcell.dev/inventory' in oldObject.metadata.labels))
      reason: Forbidden
      messageExpression: |-
        'streamcell namespace protection: user ' + request.userInfo.username +
        ' may not add or remove the streamcell.dev/inventory label on namespace ' + object.metadata.name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: streamcell-namespace-protection
spec:
  policyName: streamcell-namespace-protection
  validationActions: [Deny, Audit]
  paramRef:
    name: streamcell-admission-params
    namespace: streamcell-system
    parameterNotFoundAction: Deny
