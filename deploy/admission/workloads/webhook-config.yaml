# Registered with failurePolicy Fail: if the guard is unreachable, pods in tenant namespaces are
# not bound (the scheduler retries). Running it as 2+ replicas with a PDB is what makes that
# acceptable. The CA bundle is injected by the certgen job.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: streamcell-binding-guard
webhooks:
  - name: binding.streamcell.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: streamcell.dev/inventory
          operator: Exists
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
    clientConfig:
      service:
        namespace: streamcell-system
        name: streamcell-admission
        path: /validate-binding
        port: 443
