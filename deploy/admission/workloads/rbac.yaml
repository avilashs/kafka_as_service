apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamcell-admission
  namespace: streamcell-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: placement-auditor
  namespace: streamcell-system
---
# Read-only view of pods and nodes: all the guard and the auditor need.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: streamcell-placement-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: streamcell-placement-reader
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: streamcell-placement-reader }
subjects:
  - { kind: ServiceAccount, name: streamcell-admission, namespace: streamcell-system }
  - { kind: ServiceAccount, name: placement-auditor, namespace: streamcell-system }
---
# The certificate job: write its Secret and inject the CA into the one webhook configuration.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: streamcell-admission-certgen
  namespace: streamcell-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: streamcell-admission-certgen
  namespace: streamcell-system
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: streamcell-admission-certgen }
subjects:
  - { kind: ServiceAccount, name: streamcell-admission, namespace: streamcell-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: streamcell-admission-certgen
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: ["streamcell-binding-guard"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: streamcell-admission-certgen
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: streamcell-admission-certgen }
subjects:
  - { kind: ServiceAccount, name: streamcell-admission, namespace: streamcell-system }
