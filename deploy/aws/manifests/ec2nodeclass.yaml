# The cell-wide EC2NodeClass every Karpenter NodePool refers to (ADR-0008, internal/cloud/aws NodeClassName).
# Variables: ${CLUSTER_NAME} ${NODE_ROLE_NAME} ${KMS_KEY_ARN}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: streamcell
spec:
  role: ${NODE_ROLE_NAME}
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: ${CLUSTER_NAME}
  # IMDSv2 only and hop limit 1: pods cannot read the node role's credentials.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    streamcell.dev/cell-cluster: ${CLUSTER_NAME}
