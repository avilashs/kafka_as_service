# The shared pool: tenant brokers of the shared tier (design section 10). Labels and taints match what the
# placement rules expect (streamcell.dev/pool=shared). Dedicated pools are created per cluster by the agent.
# Variables: ${SHARED_INSTANCE_TYPE} ${SHARED_MAX_NODES}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: shared
spec:
  template:
    metadata:
      labels:
        streamcell.dev/pool: shared
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: streamcell
      requirements:
        - { key: node.kubernetes.io/instance-type, operator: In, values: ["${SHARED_INSTANCE_TYPE}"] }
        - { key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"] }
        - { key: topology.kubernetes.io/zone, operator: Exists }
      expireAfter: Never
  limits:
    nodes: "${SHARED_MAX_NODES}"
  disruption:
    # Brokers are not moved to save money: only empty nodes are consolidated, one disruption at a time.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
