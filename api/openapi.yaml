openapi: 3.0.3
info:
  title: Streamcell API
  version: 0.1.0-m3
  description: |
    Tenant API for managed Apache Kafka clusters. Every mutation is asynchronous,
    requires an `Idempotency-Key` header, and returns an `Operation`.
    Scope: clusters (shared and dedicated tiers), operations, bootstrap endpoints, SCRAM users and the cluster CA certificate.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080
security:
  - bearer: []
paths:
  /v1/clusters:
    post:
      operationId: createCluster
      summary: Create a cluster
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClusterRequest' }
      responses:
        '202': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: listClusters
      summary: List clusters
      responses:
        '200':
          description: Clusters owned by the caller's tenant
          content:
            application/json:
              schema:
                type: object
                required: [clusters]
                properties:
                  clusters:
                    type: array
                    items: { $ref: '#/components/schemas/Cluster' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
    get:
      operationId: getCluster
      summary: Describe a cluster
      responses:
        '200':
          description: The cluster
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cluster' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCluster
      summary: Change a cluster (resize, scale, expand storage, change configuration, upgrade)
      description: |
        A JSON merge patch (RFC 7386) of `spec`. One kind of change per request:
        `brokerType` (resize: rolling restart, one broker at a time), `brokerCount` (scale out or in, in
        steps of 3; partitions are rebalanced by Cruise Control), `storage` (grow only), `config`
        (allowlisted broker configuration; dynamic where Kafka allows), or `kafkaVersion` (forward only).
        Users are changed through the user endpoints. The operation succeeds when the cluster is Ready
        again for the new spec: rolls finished and, for scale, the rebalance complete.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [spec]
              properties:
                spec: { type: object, description: 'Partial KafkaSpec; a null value removes a config key' }
      responses:
        '202': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteCluster
      summary: Delete a cluster
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/bootstrap-brokers:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
    get:
      operationId: getBootstrapBrokers
      summary: Bootstrap endpoints per authentication mechanism
      responses:
        '200':
          description: Endpoints
          content:
            application/json:
              schema:
                type: object
                required: [clusterId, endpoints]
                properties:
                  clusterId: { type: string }
                  endpoints:
                    type: object
                    additionalProperties: { type: string }
                    example: { scram-sha-512: 'bootstrap.kc-1a2b3c4d5e.cell-1.streams.example.net:443' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/ca-certificate:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
    get:
      operationId: getCaCertificate
      summary: PEM CA certificate that clients must trust for this cluster
      description: Every cluster has its own CA. The certificate is public; give it to the client truststore (`ssl.truststore.certificates`).
      responses:
        '200':
          description: PEM certificate
          content:
            application/x-pem-file:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/scram-users:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
    get:
      operationId: listScramUsers
      summary: List SCRAM users (never includes passwords)
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/ScramUser' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createScramUser
      summary: Create a SCRAM-SHA-512 user
      description: The platform generates a 256-bit password; read it with the credentials endpoint once the operation has succeeded.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScramUserRequest' }
      responses:
        '202': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/scram-users/{name}:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
      - $ref: '#/components/parameters/UserName'
    delete:
      operationId: deleteScramUser
      summary: Delete a SCRAM user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/scram-users/{name}/rotate:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
      - $ref: '#/components/parameters/UserName'
    post:
      operationId: rotateScramUser
      summary: Replace a user's password with a new random one
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/scram-users/{name}/credentials:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
      - $ref: '#/components/parameters/UserName'
    get:
      operationId: getScramCredentials
      summary: Read a user's current password
      description: The password is read from the secret manager on every call and is never stored in the platform database. The response is not cacheable.
      responses:
        '200':
          description: Credentials
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScramCredentials' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/mtls-users:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
    get:
      operationId: listMtlsUsers
      summary: List certificate-authenticated users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/MtlsUser' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createMtlsUser
      summary: Create a certificate-authenticated user
      description: |
        Generate a key pair and a PKCS#10 request on your side and send only the request: the private key never
        leaves you. The cluster's clients CA signs a client certificate for the request's public key with
        subject `CN=<name>` (the subject in your request is ignored). Read the certificate with
        `GET .../mtls-users/{name}/certificate` once the operation has succeeded. Connect to the
        `mtls` bootstrap endpoint (`GET /bootstrap-brokers`) with that certificate and trust the cluster CA.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMtlsUserRequest' }
      responses:
        '202': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/mtls-users/{name}:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
      - $ref: '#/components/parameters/UserName'
    delete:
      operationId: deleteMtlsUser
      summary: Delete a certificate-authenticated user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/mtls-users/{name}/renew:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
      - $ref: '#/components/parameters/UserName'
    post:
      operationId: renewMtlsCertificate
      summary: Have a new certificate signed for a new request
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csr]
              properties:
                csr: { type: string, description: PEM PKCS#10 certificate request }
      responses:
        '202': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/clusters/{id}/mtls-users/{name}/certificate:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
      - $ref: '#/components/parameters/UserName'
    get:
      operationId: getMtlsCertificate
      summary: The client certificate issued for the user
      responses:
        '200':
          description: PEM certificate (public)
          content:
            application/x-pem-file:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/operations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOperation
      summary: Get an operation
      responses:
        '200':
          description: The operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Liveness
      responses:
        '204': { description: Healthy }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key, scoped to the tenant, kept 7 days. Same key and body replays the original operation; same key with a different body returns 422.
      schema: { type: string, minLength: 1, maxLength: 255 }
    UserName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$' }
    ClusterID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^kc-[0-9a-f]{10}$' }
  responses:
    Operation:
      description: Accepted; poll the operation
      headers:
        Idempotent-Replayed:
          description: Present and "true" when the response replays an earlier request
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Operation' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CreateClusterRequest:
      type: object
      additionalProperties: false
      required: [name, tier, spec]
      properties:
        name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$' }
        engine: { type: string, enum: [kafka], default: kafka }
        tier: { type: string, enum: [shared, dedicated], description: 'dedicated reserves whole nodes (one broker per node)' }
        spec: { $ref: '#/components/schemas/KafkaSpec' }
    KafkaSpec:
      type: object
      additionalProperties: false
      required: [kafkaVersion, brokerType, brokerCount, storage]
      properties:
        kafkaVersion: { type: string, enum: ['4.3.0', '4.3.1'] }
        brokerType:
          type: string
          enum: [s.small, s.medium, s.large, d.xlarge, d.2xlarge, d.4xlarge, d.8xlarge, d.nvme.2xlarge, d.nvme.4xlarge, dev.tiny, dev.small, dev.ded]
        brokerCount: { type: integer, minimum: 3, maximum: 48, multipleOf: 3 }
        storage:
          type: object
          additionalProperties: false
          required: [sizeGiB]
          properties:
            sizeGiB: { type: integer, minimum: 1 }
            maxSizeGiB: { type: integer, minimum: 1 }
            autoExpand: { type: boolean }
        config:
          type: object
          description: Allowlisted broker configuration (see docs/design.md §15.1)
          additionalProperties: { type: string }
    Cluster:
      type: object
      required: [id, name, engine, tier, state, spec, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        engine: { type: string }
        tier: { type: string, enum: [shared, dedicated] }
        state: { type: string, enum: [CREATING, ACTIVE, UPDATING, DEGRADED, FAILED, DELETING] }
        stateReason: { type: string }
        spec: { $ref: '#/components/schemas/KafkaSpec' }
        cellId: { type: string }
        currentOperationId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ACL:
      type: object
      additionalProperties: false
      required: [resource, operations]
      properties:
        resource:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [topic, group, transactionalId, cluster] }
            name: { type: string }
            patternType: { type: string, enum: [literal, prefix] }
        operations:
          type: array
          minItems: 1
          items: { type: string }
          description: 'Cluster ACLs may only grant Describe, DescribeConfigs, Create and IdempotentWrite.'
    CreateScramUserRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$', description: 'Names starting with "platform" are reserved.' }
        admin: { type: boolean, description: 'Full control of topics, groups and transactional ids, plus the cluster-level operations a client needs; nothing that touches the brokers.' }
        acls:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ACL' }
    CreateMtlsUserRequest:
      type: object
      additionalProperties: false
      required: [name, csr]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$', description: 'Names starting with "platform" or "kc-" are reserved. The Kafka principal is `User:CN=<name>`.' }
        csr: { type: string, description: 'PEM PKCS#10 request; RSA 2048-4096 or ECDSA P-256/P-384' }
        admin: { type: boolean }
        acls:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ACL' }
    MtlsUser:
      type: object
      required: [name, mechanism, principal, admin, acls]
      properties:
        name: { type: string }
        mechanism: { type: string, enum: [mTLS] }
        principal: { type: string, example: 'User:CN=service-1' }
        admin: { type: boolean }
        acls:
          type: array
          items: { $ref: '#/components/schemas/ACL' }
    ScramUser:
      type: object
      required: [name, mechanism, principal, admin, acls]
      properties:
        name: { type: string }
        principal: { type: string }
        mechanism: { type: string, enum: [SCRAM-SHA-512] }
        admin: { type: boolean }
        acls:
          type: array
          items: { $ref: '#/components/schemas/ACL' }
    ScramCredentials:
      type: object
      required: [username, password, mechanism, secretVersion]
      properties:
        username: { type: string }
        password: { type: string }
        mechanism: { type: string, enum: [SCRAM-SHA-512] }
        secretVersion: { type: integer }
    Operation:
      type: object
      required: [id, clusterId, type, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        clusterId: { type: string }
        type: { type: string, enum: [CreateCluster, DeleteCluster, CreateScramUser, RotateScramUser, DeleteScramUser, CreateMtlsUser, RenewMtlsCertificate, DeleteMtlsUser, ChangeConfig, ResizeCluster, ScaleCluster, ExpandStorage, UpgradeCluster] }
        state: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        step: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
